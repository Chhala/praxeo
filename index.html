<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FBFBF9">
<title>Praxeo</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/praxeo.css">
</head>
<body>
<!-- Seuil (24/11/2026) : un toucher avant l'accueil, pour que l'iPhone autorise le son du crayon dès le premier message -->
<div class="seuil" id="seuil" hidden>
  <div class="seuil-titre">PRAXEO</div>
  <div class="seuil-date" id="seuil-date"></div>
  <blockquote class="seuil-maxime" id="seuil-maxime"></blockquote>
  <div class="seuil-appel">Touche pour commencer</div>
</div>
<div class="app">

  <!-- EN-TÊTE COMMUN : titre de l'onglet, frise, élément de droite -->
  <header class="entete">
    <div class="entete-gauche">
      <h1 class="titre" id="titre">PRAXEO</h1>
      <!-- Méandre de la v1, répété à taille fixe : le motif reste identique quelle que soit la longueur de la frise -->
      <svg class="frise" aria-hidden="true">
        <defs>
          <pattern id="meandre" patternUnits="userSpaceOnUse" width="17.4" height="7" viewBox="0 0 16 8" preserveAspectRatio="none">
            <path d="M0,4 h4 v-3 h4 v6 h4 v-6 h4 v3"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="url(#meandre)"/>
      </svg>
    </div>
    <!-- emplacement de droite, toujours réservé : la frise a la même longueur sur tous les onglets -->
    <div class="entete-droite">
      <button class="couronne" id="couronne" type="button" aria-label="Série en cours, voir les statistiques">
        <span class="couronne-img" aria-hidden="true"></span>
        <span class="couronne-nb" id="serieNb">0</span>
      </button>
      <button class="btn-plus" id="btnPlus" type="button" aria-label="Ajouter une praxis" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </header>

  <main class="pages">

    <!-- ACCUEIL -->
    <section class="page" id="page-accueil">
      <div class="zone" id="zone">
        <div class="zone-cale" aria-hidden="true"></div>
        <div class="zone-cale-btn" aria-hidden="true"></div>
        <div class="zone-cale-g" aria-hidden="true"></div>
        <div class="zone-cale-minuteur" aria-hidden="true"></div>
        <div class="zone-texte" id="zoneTexte" aria-live="polite"></div>
        <button class="zone-btn" id="zoneBtn" type="button" aria-label="Parler à Kairos"></button>
        <button class="zone-minuteur" id="zoneMinuteur" type="button" hidden></button>
      </div>
      <!-- réponses rapides du coach, en bulles (§5.5) ; visibles seulement quand il pose une question -->
      <div class="reponses" id="reponses" hidden></div>
      <ol class="programme" id="programme"></ol>
      <div class="lignes" id="lignes"></div>
    </section>

    <!-- PRAXIS -->
    <section class="page" id="page-praxis" hidden>
      <label class="recherche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0M21 21l-6 -6"/></svg>
        <input id="praxisRecherche" type="search" placeholder="Rechercher" autocomplete="off" aria-label="Rechercher une praxis">
      </label>
      <div class="lignes-praxis" id="praxisListe"></div>
    </section>

    <!-- STATS -->
    <section class="page" id="page-stats" hidden>
      <div id="statsContenu"></div>
    </section>

    <!-- RÉGLAGES -->
    <section class="page" id="page-reglages" hidden>
      <div id="reglagesContenu"></div>
    </section>

  </main>

  <!-- ANNULER : mention temporaire après chaque action (§14, validé le 19/11/2026) -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-texte"></span>
    <button class="toast-annuler" type="button">Annuler</button>
  </div>

  <!-- BARRE DE NAVIGATION -->
  <nav class="barre" aria-label="Onglets">
    <button class="onglet" data-page="accueil" type="button" aria-label="Accueil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1"/></svg>
    </button>
    <button class="onglet" data-page="praxis" type="button" aria-label="Praxis">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M5 6v.01M5 12v.01M5 18v.01"/></svg>
    </button>
    <button class="onglet" data-page="stats" type="button" aria-label="Stats">
      <!-- calendrier de cases (validé le 17/11/2026) -->
      <svg class="trait-fin" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="17" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="17" y="9.75" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="17" width="4.5" height="4.5" rx="1"/><rect x="9.75" y="17" width="4.5" height="4.5" rx="1"/></svg>
    </button>
    <button class="onglet" data-page="reglages" type="button" aria-label="Réglages">
      <!-- compas avec traverse, qui trace un arc (à l'essai, 17/11/2026) -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.6" r="1.8"/><path d="M12 2.8v-1.3M11.1 6.2l-4.1 12.3M12.9 6.2l4.1 12.3M8.7 13.2h6.6M4.5 21c4.8 1.5 10.2 1.5 15 0"/></svg>
    </button>
  </nav>

</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
